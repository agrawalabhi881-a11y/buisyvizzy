name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://supply_chain:supply_chain_ci@localhost:5432/supply_chain
      JWT_SECRET_KEY: ci-only-secret-key-not-for-real-use-0123456789abcdef
      APP_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: supply_chain
          POSTGRES_USER: supply_chain
          POSTGRES_PASSWORD: supply_chain_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supply_chain -d supply_chain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy app scripts
      - run: alembic upgrade head
      - run: pytest
      - run: python -m scripts.seed --help
      - run: alembic history

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --pretty false
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: supply_chain_ci_password
      JWT_SECRET_KEY: ci-only-secret-key-not-for-real-use-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet
      - run: docker compose build
